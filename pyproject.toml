[project]
name = "tfg-sergio-v2-mcp-server"
version = "0.1.0"
description = "Servidor MCP para integrar herramientas de Unity"
readme = "README.md"
authors = [
    { name = "DreaNite", email = "angodi20@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "mcp>=1.26.0",
]

[project.scripts]
tfg-sergio-v2-mcp-server = "tfg_sergio_v2_mcp_server.main:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
